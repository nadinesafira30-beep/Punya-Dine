<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Nadine Safira</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="portfolio.html">Portofolio</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>


    <!-- CONTACT -->
    <main>

        <section class="contact-content">

            <!-- GAMBAR -->
            <div class="contact-image">

                <img src="PNG/gambar10.png"
                     alt="Nadine Safira">

            </div>


            <!-- CONTACT INFO -->
            <div class="contact-info">

                <h1>
                    Contact Info
                </h1>

                <p class="talk">
                    Let's talk about another project or say hi!
                </p>


                <p>
                    Email:
                    <br>

                    <strong>
                        nadine@example.com
                    </strong>
                </p>


                <p>
                    Location:
                    <br>

                    <strong>
                        Indonesia
                    </strong>
                </p>


                <!-- FORM -->
                <form class="contact-form">

                    <label for="nama">
                        Nama:
                    </label>

                    <input
                        type="text"
                        id="nama"
                        name="nama"
                        placeholder="Tulis nama kamu..."
                    >


                    <label for="pesan">
                        Pesan:
                    </label>

                    <textarea
                        id="pesan"
                        name="pesan"
                        placeholder="Tulis pesan kamu..."
                    ></textarea>


                    <button type="submit">
                        Send
                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>
        Copyright © 2026 Nadine Safira.
    </footer>

</body>
</html>
